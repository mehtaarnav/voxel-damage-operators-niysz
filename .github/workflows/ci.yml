name: verify

# Three of the figure defects in this project were introduced by regenerating a
# data table and not re-checking the figures that consume it, and no code
# reading caught any of them. This job regenerates every figure that depends
# only on committed tables and compares the result against what is committed.
#
# The comparison is on rendered pixels with a tolerance, not on bytes. matplotlib
# embeds glyph outlines produced by FreeType, and different FreeType versions
# give different outlines for identical content, so a figure built on one
# platform never matches one built on another byte-for-byte. Pixels with a
# tolerance test the thing that matters: whether the figure still shows what its
# source data says.
#
# Figures derived from the tomograms (scripts/project2/primer_figures*.py) are
# NOT covered: they need the 2.2 GB Zenodo dataset, which is deliberately not
# in the repository.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"

      - name: Install poppler (pdftoppm, used to rasterise figures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Check every figure still matches its source data
        env:
          MPLBACKEND: Agg
          SOURCE_DATE_EPOCH: "1735689600"
        run: python scripts/project2/check_figures_match_data.py

      - name: Check every number cited in the manuscript against its source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/project2/verify_manuscript_numbers.py
