name: verify

# The point of this workflow is narrow and specific. Three of the figure
# defects found in this project were introduced by regenerating a data table
# and not re-checking the figures that consume it. A human reading the code
# would not have caught any of them. This job regenerates every figure that
# depends only on committed CSVs and fails if the output differs from what is
# committed, which turns that class of defect into a build failure.
#
# Figures derived from the tomograms (scripts/project2/primer_figures*.py) are
# NOT covered: they need the 2.2 GB Zenodo dataset, which is deliberately not
# in the repository.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Regenerate CSV-driven figures
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts/project2
          MPLBACKEND: Agg
          # matplotlib stamps a creation date into every PDF, so without this
          # the byte comparison below would fail on every run regardless of
          # content. Any fixed value works; this one is 2025-01-01T00:00:00Z.
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          python scripts/project2/make_figures.py
          python scripts/project2/make_figures_o7.py
          python scripts/project2/make_figure_threshold.py

      - name: Fail if any regenerated figure differs from the committed one
        run: |
          if ! git diff --quiet -- out/writeup/figs; then
            echo "::error::A committed figure no longer matches its source data."
            echo "Changed files:"
            git diff --name-only -- out/writeup/figs
            echo
            echo "Regenerate locally and commit, or fix the script."
            exit 1
          fi
          echo "All CSV-driven figures reproduce byte-for-byte."

      - name: Check every number cited in the manuscript against its source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/project2/verify_manuscript_numbers.py
